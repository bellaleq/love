<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دنیایی ما</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      font-family: "Vazirmatn", Tahoma, sans-serif;
      background: radial-gradient(circle at 50% 20%, #10151d 0%, #05070a 65%);
      color: #e6f3ef;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* هالهٔ سبز پشت ماسک */
    body::before {
      content: "";
      position: fixed;
      top: 30%;
      left: 50%;
      width: 420px;
      height: 420px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(0,255,156,0.18), transparent 65%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
      animation: pulse 5s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      to   { opacity: 1;   transform: translate(-50%, -50%) scale(1.12); }
    }

    .wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      max-width: 420px;
      width: 100%;
    }

    /* ماسک انانیموس */
    .mask {
      width: clamp(180px, 42vw, 240px);
      height: auto;
      filter:
        drop-shadow(0 0 20px rgba(0,255,156,0.45))
        drop-shadow(0 0 40px rgba(0,255,156,0.25));
      animation: floatMask 5s ease-in-out infinite;
    }

    @keyframes floatMask {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    /* عنوان */
    .title {
      font-weight: 900;
      font-size: clamp(34px, 9vw, 52px);
      line-height: 1.2;
      background: linear-gradient(135deg, #ffffff 0%, #a7fff0 40%, #00ff9c 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #7ba396;
      font-size: 13px;
      line-height: 1.9;
      max-width: 320px;
    }

    /* دکمهٔ ورود */
    #enterBtn {
      width: 100%;
      max-width: 300px;
      padding: 17px 24px;
      border: 2px solid #00ff9c;
      border-radius: 14px;
      cursor: pointer;
      background: rgba(0, 255, 156, 0.06);
      color: #00ff9c;
      font-family: inherit;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0,255,156,0.55);
      box-shadow:
        0 0 22px rgba(0,255,156,0.25),
        inset 0 0 20px rgba(0,255,156,0.06);
      transition: 0.28s ease;
    }

    #enterBtn:hover {
      background: #00ff9c;
      color: #021208;
      text-shadow: none;
      transform: translateY(-2px);
      box-shadow:
        0 0 35px rgba(0,255,156,0.65),
        0 0 70px rgba(0,255,156,0.35),
        inset 0 0 20px rgba(0,255,156,0.4);
    }

    #enterBtn:active { transform: translateY(0) scale(0.98); }

    #enterBtn:disabled {
      cursor: wait;
      opacity: 0.85;
      background: #00ff9c;
      color: #021208;
      text-shadow: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- ماسک انانیموس (Guy Fawkes) -->
    <svg class="mask" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg" aria-label="Anonymous Mask">
      <defs>
        <linearGradient id="maskGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f4fff9"/>
          <stop offset="55%" stop-color="#d6ece4"/>
          <stop offset="100%" stop-color="#9fc0b6"/>
        </linearGradient>
        <linearGradient id="shadowGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7a968d" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#2b3f39" stop-opacity="0.85"/>
        </linearGradient>
      </defs>

      <!-- پایهٔ صورت -->
      <path d="M100 8
               C 60 8, 30 45, 30 95
               C 30 130, 40 165, 55 200
               C 68 230, 84 250, 100 252
               C 116 250, 132 230, 145 200
               C 160 165, 170 130, 170 95
               C 170 45, 140 8, 100 8 Z"
            fill="url(#maskGrad)"
            stroke="#2b3f39"
            stroke-width="2.5"/>

      <!-- سایهٔ بالا -->
      <path d="M100 8
               C 60 8, 30 45, 30 95
               C 30 100, 30 105, 31 110
               C 55 75, 80 60, 100 60
               C 120 60, 145 75, 169 110
               C 170 105, 170 100, 170 95
               C 170 45, 140 8, 100 8 Z"
            fill="url(#shadowGrad)"/>

      <!-- ابروی چپ (چین‌دار) -->
      <path d="M40 92
               C 55 74, 78 70, 96 78
               L 96 86
               C 78 80, 58 84, 46 98 Z"
            fill="#1c2825"/>

      <!-- ابروی راست -->
      <path d="M160 92
               C 145 74, 122 70, 104 78
               L 104 86
               C 122 80, 142 84, 154 98 Z"
            fill="#1c2825"/>

      <!-- چشم چپ -->
      <ellipse cx="72" cy="112" rx="18" ry="11" fill="#0b1412" transform="rotate(-10 72 112)"/>
      <ellipse cx="72" cy="112" rx="6" ry="6" fill="#00ff9c" opacity="0.9"/>

      <!-- چشم راست -->
      <ellipse cx="128" cy="112" rx="18" ry="11" fill="#0b1412" transform="rotate(10 128 112)"/>
      <ellipse cx="128" cy="112" rx="6" ry="6" fill="#00ff9c" opacity="0.9"/>

      <!-- سبیل / بینی -->
      <path d="M100 128
               C 98 140, 96 152, 90 160
               C 96 166, 104 166, 110 160
               C 104 152, 102 140, 100 128 Z"
            fill="#1c2825"/>

      <!-- سبیل -->
      <path d="M78 168
               C 88 162, 96 164, 100 168
               C 104 164, 112 162, 122 168
               C 118 174, 108 176, 100 174
               C 92 176, 82 174, 78 168 Z"
            fill="#1c2825"/>

      <!-- دهان با لبخند شیطانی -->
      <path d="M70 196
               C 82 210, 118 210, 130 196
               C 122 214, 78 214, 70 196 Z"
            fill="#0b1412"/>

      <!-- خط فک/چانه -->
      <path d="M62 178
               C 72 214, 128 214, 138 178"
            fill="none"
            stroke="#2b3f39"
            stroke-width="1.5"
            opacity="0.5"/>
    </svg>

    <h1 class="title">دنیایی ما</h1>
    <p class="subtitle">برای ورود، روی دکمهٔ زیر بزن.</p>

    <button id="enterBtn" type="button">ورود</button>
  </div>

  <script>
    // لینک مقصد (معکوس ذخیره شده)
    // https://app-fbdyb7ny6lfl.appmedo.com
    const TARGET = "moc.odemppa.lfl6yn7bydbf-ppa//:sptth"
      .split("").reverse().join("");

    const btn = document.getElementById("enterBtn");
    btn.addEventListener("click", () => {
      btn.disabled = true;
      btn.textContent = "در حال ورود...";
      window.location.href = TARGET;
    });
  </script>
</body>
</html>
